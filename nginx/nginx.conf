# The main Nginx configuration file
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ensure the server block is inside the http context
    server {
        listen 80;
        server_name sbc.pyaesoneaung.com www.sbc.pyaesoneaung.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


server {
    listen 443 ssl;
    server_name sbc.pyaesoneaung.com www.sbc.pyaesoneaung.com;

    ssl_certificate /etc/letsencrypt/live/sbc.pyaesoneaung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbc.pyaesoneaung.com/privkey.pem;

    location /api {
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://sbc-server:4567;
    }

    location / {
 proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_pass http://sbc-client:3000;
                
    }

}





}
 
